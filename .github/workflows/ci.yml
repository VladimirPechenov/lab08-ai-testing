name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit, solvability and performance tests
        run: python -m pytest --durations=10 --junitxml=results/junit.xml
      - name: Bot experiment (300 runs)
        run: python -m bot.experiment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: results/
